        <animate attributeName="baseFrequency"
                 dur="6s"

      <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G">

                 dur="6s"
                 values="25;35;25"
                 repeatCount="indefinite"/>
      </feDisplacementMap>
